apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
/**
 * Resolve a path by running node from android/, returning it as a File.
 *
 * Gradle's String.execute() swallows a non-zero exit status, so a failed
 * require.resolve() yields an empty string and `new File("")` silently becomes
 * the android/app *directory*. That then fails much later and far away, as
 * "property 'cliFile' ... is not a file" plus a burst of unrelated
 * implicit-dependency errors against every task writing under android/app.
 * Failing here instead keeps the cause next to the mistake.
 */
def resolveNodeFile(List<String> command, String label) {
    def stdout = new StringBuilder()
    def stderr = new StringBuilder()
    def proc = command.execute(null, rootDir)
    proc.waitForProcessOutput(stdout, stderr)
    def resolved = stdout.toString().trim()
    if (proc.exitValue() != 0 || resolved.isEmpty()) {
        throw new GradleException(
            "Could not resolve ${label} from ${rootDir}. " +
            "Run 'npm install' in react-native-app/ and try again. " + stderr)
    }
    def resolvedFile = new File(resolved)
    if (!resolvedFile.isFile()) {
        throw new GradleException(
            "Resolved ${label} to '${resolved}', which is not a file.")
    }
    return resolvedFile
}

react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()

    /* Bundle through the Expo CLI (added with expo modules) */
    entryFile = resolveNodeFile(
        ["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"],
        "the app entry point (expo/scripts/resolveAppEntry)")
    // Resolve @expo/cli *through the expo package* rather than by bare module name.
    // npm does not reliably hoist it: here it installs to
    // node_modules/expo/node_modules/@expo/cli, which a bare
    // require.resolve('@expo/cli') run from android/ cannot see. settings.gradle
    // already resolves expo-modules-autolinking this same way.
    cliFile = resolveNodeFile(
        ["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"],
        "@expo/cli")
    bundleCommand = "export:embed"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Release signing credentials are read from android/keystore.properties, which is
// gitignored so the keystore password never lands in version control. If the file
// is absent (e.g. a fresh clone without secrets) release falls back to debug signing.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.kegelee.app"

    // Don't let Android Lint gate release builds. lintVitalRelease adds a heavy,
    // memory-hungry pass and flags mostly-cosmetic issues in the RN/third-party
    // android code; the app is validated at runtime instead.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    // Pin CMake 4.1.2 (ships ninja 1.12.1, which is long-path aware) instead of the
    // AGP default 3.22.1 / ninja 1.10.2 that rejects RN new-arch codegen paths >260
    // chars on Windows. Install via Android Studio > SDK Manager > SDK Tools > CMake.
    //
    // WINDOWS ONLY: that MAX_PATH limit does not exist on Linux, and the EAS
    // build images ship CMake 3.22.1 - pinning 4.1.2 there fails the build with
    // "[CXX1300] CMake '4.1.2' was not found in SDK, PATH, or by cmake.dir".
    // So apply the pin only where it is actually needed.
    if (System.getProperty("os.name").toLowerCase().contains("windows")) {
        externalNativeBuild {
            cmake {
                version "4.1.2"
            }
        }
    }

    defaultConfig {
        applicationId "com.kegelee.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 83
        versionName "1.0.66"

        // CMake arguments:
        //  - CMAKE_OBJECT_PATH_MAX: belt-and-suspenders cap on New-Arch codegen
        //    object paths (the pinned ninja 1.12.1 is long-path aware anyway).
        //  - CMAKE_POLICY_VERSION_MINIMUM: CMake 4 removed compatibility with
        //    projects requesting cmake_minimum_required < 3.5; allow them so the
        //    NDK / RN codegen CMakeLists still configure.
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_OBJECT_PATH_MAX=240", "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystoreProperties['storeFile']) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Sign with the real kegelee release key when keystore.properties is
            // present; otherwise fall back to debug signing so the build still runs.
            signingConfig keystoreProperties['storeFile'] ? signingConfigs.release : signingConfigs.debug
            // R8 full mode: shrink + obfuscate Java/Kotlin bytecode and strip unused
            // resources. Keep rules live in proguard-rules.pro.
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

