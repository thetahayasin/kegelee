<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#060810">
    <title>Offline — Kegel Trainer</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #060810; color: #fff; min-height: 100dvh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 2rem; text-align: center;
        }
        .icon {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(193,255,114,0.1); border: 2px solid rgba(193,255,114,0.3);
            display: grid; place-items: center; margin: 0 auto 1.5rem;
        }
        .icon svg { width: 36px; height: 36px; color: #c1ff72; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        p { color: #8A8F98; font-size: 0.9rem; line-height: 1.5; max-width: 320px; margin-bottom: 2rem; }
        button {
            height: 48px; padding: 0 2rem; border-radius: 12px;
            background: #c1ff72; color: #0c1a00; font-weight: 600;
            border: none; cursor: pointer; font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        .data-section { margin-top: 2.5rem; width: 100%; max-width: 400px; text-align: left; }
        .data-section h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; color: #8A8F98; }
        .exercise-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .exercise-item {
            background: #16181F; border-radius: 12px; padding: 0.75rem 1rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .exercise-item .name { font-weight: 500; font-size: 0.9rem; }
        .exercise-item .meta { color: #8A8F98; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-3.03M10.71 5.05A16 16 0 0122.56 9M1.42 9a16 16 0 014.47-2.49M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>
        </svg>
    </div>
    <h1>You're offline</h1>
    <p>Don't worry — your training data is saved locally. Connect to the internet to sync your progress.</p>
    <button onclick="window.location.reload()">Try Again</button>

    <div class="data-section" id="offline-exercises" style="display:none">
        <h2>Available exercises</h2>
        <div class="exercise-list" id="exercise-list"></div>
    </div>

    <script>
    // Show pre-seeded exercises from IndexedDB if available.
    (function() {
        if (!('indexedDB' in window)) return;
        var req = indexedDB.open('kegelee', 1);
        req.onsuccess = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('exercises')) return;
            var tx = db.transaction('exercises', 'readonly');
            var store = tx.objectStore('exercises');
            var getAll = store.getAll();
            getAll.onsuccess = function() {
                var exercises = getAll.result;
                if (!exercises || !exercises.length) return;
                var section = document.getElementById('offline-exercises');
                var list = document.getElementById('exercise-list');
                section.style.display = '';
                exercises.sort(function(a, b) { return a.sort_order - b.sort_order; });
                exercises.forEach(function(ex) {
                    var div = document.createElement('div');
                    div.className = 'exercise-item';
                    div.innerHTML = '<span class="name">' + ex.name + '</span>'
                        + '<span class="meta">' + (ex.unlock_after_days > 0 ? 'Unlocks after ' + ex.unlock_after_days + ' days' : 'Available') + '</span>';
                    list.appendChild(div);
                });
            };
        };
    })();
    </script>
</body>
</html>
